services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: aggregator-pg-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - aggregator_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: aggregator-dashboard-prod
    ports:
      - "3030:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GRAFANA_POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: ghcr.io/alex-alyushin/job-sense:${APP_IMAGE_TAG:-prod}
    container_name: aggregator-app-prod
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - embedding_models_prod:/app/embedding/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: ghcr.io/amacneil/dbmate:2.27.0
    profiles: ["tools"]
    command: ["--wait", "--no-dump-schema", "up"]
    env_file:
      - .env
    volumes:
      - ./db/migrations:/db/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  aggregator_data_prod:
  embedding_models_prod:
